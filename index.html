<style>

*{ box-sizing:border-box; }

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#e9e9e9;
    color:#111;
}

.app{
    max-width:520px;
    margin:0 auto;
    height:100dvh;
    height:100vh;
    background:#ffffff;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}

@media(min-width:560px){

    .app{
        border-left:2px solid #111;
        border-right:2px solid #111;
        box-shadow:0 10px 50px rgba(0,0,0,.12);
    }
}

/* ---------- en-tête / logo ---------- */

.app-header{
    flex:0 0 auto;
    padding:16px 24px 12px;
    border-bottom:2px solid #111;
    display:flex;
    justify-content:center;
    background:#fff;
}

.app-header svg{
    width:100%;
    max-width:300px;
    height:auto;
    display:block;
}

/* ---------- carte encadrée en tirets ---------- */

.map-wrap{
    flex:1 1 auto;
    position:relative;
    min-height:0;
}

.map-frame{
    position:absolute;
    inset:14px;
    border:2px dashed #111;
    border-radius:20px;
    overflow:hidden;
    background:#fff;
}

#map{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ---------- pied / bouton calques ---------- */

.app-footer{
    flex:0 0 auto;
    border-top:2px solid #111;
    display:flex;
    justify-content:center;
    padding:10px 16px;
    background:#fff;
}

.layers-btn{
    display:flex;
    align-items:center;
    gap:9px;
    background:#fff;
    border:2px solid #111;
    border-radius:999px;
    padding:9px 20px;
    font-weight:bold;
    font-size:14px;
    color:#111;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.layers-btn:active{ transform:translateY(1px); }

.layers-btn svg{
    width:18px;
    height:18px;
    flex:0 0 auto;
}

/* ---------- panneau "calques" (bottom sheet) ---------- */

.sheet-backdrop{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.25);
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
}

.sheet-backdrop.open{
    opacity:1;
    pointer-events:auto;
}

.sheet{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    z-index:61;
    background:#fff;
    border-top:2px solid #111;
    border-radius:20px 20px 0 0;
    max-height:78%;
    overflow-y:auto;
    padding:10px 22px 22px;
    transform:translateY(100%);
    transition:transform .25s ease;
}

.sheet.open{ transform:translateY(0); }

.sheet-handle{
    width:38px;
    height:4px;
    background:#111;
    opacity:.25;
    border-radius:2px;
    margin:8px auto 14px;
}

.sheet h2{
    margin:0 0 4px;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:#777;
}

.sheet .section{
    margin-bottom:18px;
}

.option-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    font-size:14.5px;
    font-weight:bold;
}

.option-row input{
    width:17px;
    height:17px;
    accent-color:#111;
    cursor:pointer;
}

.legend-row{
    display:flex;
    align-items:center;
    gap:9px;
    padding:2px 0;
    font-size:12.5px;
}

.legend-swatch{
    flex:0 0 auto;
    width:24px;
    height:6px;
    border-radius:3px;
}

.legend-swatch.dashed{
    background-image:linear-gradient(to right,#d81e2c 60%,transparent 0%);
    background-size:6px 6px;
    background-repeat:repeat-x;
    background-color:transparent;
}

.legend-swatch.dot{
    width:12px;
    height:12px;
    border-radius:50%;
}

/* ---------- indicateur de zoom / chargement ---------- */

.pill{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    border:2px solid #111;
    border-radius:999px;
    padding:7px 16px;
    font-size:12.5px;
    font-weight:bold;
    white-space:nowrap;
    z-index:30;
    transition:opacity .2s ease;
}

#zoom-hint{ bottom:28px; }

#loading-indicator{
    top:26px;
    background:#111;
    color:#fff;
    border-color:#111;
    opacity:0;
    pointer-events:none;
}

#loading-indicator.visible{ opacity:1; }

.hidden{ opacity:0; pointer-events:none; }

/* ---------- popup ---------- */

.maplibregl-popup-content{
    border-radius:14px!important;
    border:2px solid #111;
    box-shadow:3px 3px 0 rgba(0,0,0,.12)!important;
    padding:12px 14px!important;
    font-family:Arial,Helvetica,sans-serif;
}

.parking-popup h3{
    margin:0 0 6px;
    font-size:14.5px;
    color:#111;
}

.parking-popup table{
    border-collapse:collapse;
    font-size:12.5px;
    width:100%;
}

.parking-popup td{ padding:2px 0; vertical-align:top; }
.parking-popup td.label{ color:#888; padding-right:10px; white-space:nowrap; }
.parking-popup a{ color:#111; font-weight:bold; }

.parking-swatch{
    display:inline-block;
    width:14px;
    height:14px;
    border-radius:4px;
    vertical-align:middle;
    margin-right:6px;
}

/* ---------- contrôles maplibre ---------- */

.maplibregl-ctrl-group{
    border-radius:12px!important;
    overflow:hidden;
    border:2px solid #111!important;
    box-shadow:2px 2px 0 rgba(0,0,0,.12)!important;
}

.maplibregl-ctrl-bottom-right{
    right:8px!important;
    bottom:8px!important;
}

</style>

<script>

/* ==========================================================
   Fonds de carte — Positron (OpenFreeMap) + relief DEM (Mappes sardes)
   ========================================================== */

const OPENFREEMAP_STYLE =
    "https://tiles.openfreemap.org/styles/positron";

const TERRAIN_DEM_URL =
    "https://tiles.mapterhorn.com/tilejson.json";

/* ==========================================================
   Services SITG
   ========================================================== */

const SITG_STATIONNEMENT_URL =
    "https://vector.sitg.ge.ch/arcgis/rest/services/OTC_STATIONNEMENT_V_PUBLIQUE/MapServer/0/query";

const SITG_PARKING_URL =
    "https://vector.sitg.ge.ch/arcgis/rest/services/OTC_PARKING/MapServer/0/query";

/* seuil abaissé + zoom initial plus proche : tout est lisible dès l'ouverture */
const STATIONNEMENT_MIN_ZOOM = 14;
const MAX_BOUNDS_WIDTH = 0.3;
const MAX_BOUNDS_HEIGHT = 0.3;

const map =
    new maplibregl.Map({

        container:"map",

        style:OPENFREEMAP_STYLE,

        center:[6.1432,46.2044],

        zoom:
            window.innerWidth<=600
            ? 14.6
            : 15.2,

        attributionControl:{
            compact:true
        }
    });

map.addControl(new maplibregl.NavigationControl(),"bottom-right");

map.addControl(
    new maplibregl.GeolocateControl({
        positionOptions:{enableHighAccuracy:true},
        trackUserLocation:true,
        showUserHeading:true
    }),
    "bottom-right"
);

let activePopup = null;

function openPopup(lngLat,html){

    if(activePopup) activePopup.remove();

    activePopup =
        new maplibregl.Popup({maxWidth:"270px"})
            .setLngLat(lngLat)
            .setHTML(html)
            .addTo(map);
}

function showLoading(){ document.getElementById("loading-indicator").classList.add("visible"); }
function hideLoading(){ document.getElementById("loading-indicator").classList.remove("visible"); }

function getCurrentBounds(){

    const b = map.getBounds();

    return {
        xmin:b.getWest(), ymin:b.getSouth(),
        xmax:b.getEast(), ymax:b.getNorth(),
        width:b.getEast()-b.getWest(),
        height:b.getNorth()-b.getSouth()
    };
}

function getBoundsKey(bounds){

    return [
        bounds.xmin.toFixed(3),bounds.ymin.toFixed(3),
        bounds.xmax.toFixed(3),bounds.ymax.toFixed(3)
    ].join(",");
}

function clearSource(sourceId){

    const source = map.getSource(sourceId);

    if(source) source.setData({type:"FeatureCollection",features:[]});
}

function updateZoomHint(){

    const hint = document.getElementById("zoom-hint");

    if(map.getZoom()<STATIONNEMENT_MIN_ZOOM)
        hint.classList.remove("hidden");
    else
        hint.classList.add("hidden");
}

/* ==========================================================
   Stationnement — chargement bbox + zoom gated
   ========================================================== */

let stationnementRequestId = 0;
let stationnementAbortController = null;
const stationnementCache = new Map();

async function loadStationnement(){

    updateZoomHint();

    if(map.getZoom()<STATIONNEMENT_MIN_ZOOM){
        clearSource("stationnement");
        return;
    }

    const bounds = getCurrentBounds();

    if(bounds.width>MAX_BOUNDS_WIDTH || bounds.height>MAX_BOUNDS_HEIGHT)
        return;

    const cacheKey = getBoundsKey(bounds);

    if(stationnementCache.has(cacheKey)){

        const source = map.getSource("stationnement");

        if(source)
            source.setData({type:"FeatureCollection",features:stationnementCache.get(cacheKey)});

        return;
    }

    const requestId = ++stationnementRequestId;

    stationnementAbortController && stationnementAbortController.abort();
    stationnementAbortController = new AbortController();
    const signal = stationnementAbortController.signal;

    const params = new URLSearchParams({
        where:"1=1",
        geometry:`${bounds.xmin},${bounds.ymin},${bounds.xmax},${bounds.ymax}`,
        geometryType:"esriGeometryEnvelope",
        inSR:"4326",
        spatialRel:"esriSpatialRelIntersects",
        outFields:"*",
        returnGeometry:"true",
        outSR:"4326",
        f:"geojson",
        resultRecordCount:"3000"
    });

    showLoading();

    try{

        const response = await fetch(SITG_STATIONNEMENT_URL+"?"+params.toString(),{signal});

        if(requestId!==stationnementRequestId) return;

        if(!response.ok)
            throw new Error("Erreur SITG stationnement : "+response.status);

        const geojson = await response.json();

        if(requestId!==stationnementRequestId) return;

        const features = geojson.features || [];

        const source = map.getSource("stationnement");

        if(source)
            source.setData({type:"FeatureCollection",features});

        stationnementCache.set(cacheKey,features);

    }
    catch(error){

        if(error.name!=="AbortError")
            console.error("Erreur chargement stationnement :",error);
    }
    finally{
        hideLoading();
    }
}

/* ==========================================================
   Parkings publics — chargement unique (canton entier)
   ========================================================== */

async function loadParkingPublic(){

    const params = new URLSearchParams({
        where:"1=1",
        outFields:"*",
        returnGeometry:"true",
        outSR:"4326",
        f:"geojson"
    });

    try{

        const response = await fetch(SITG_PARKING_URL+"?"+params.toString());

        if(!response.ok)
            throw new Error("Erreur SITG parkings : "+response.status);

        const geojson = await response.json();

        const source = map.getSource("parking-public");

        if(source) source.setData(geojson);

    }
    catch(error){
        console.error("Erreur chargement parkings publics :",error);
    }
}

/* ==========================================================
   Style — priorité visuelle à la durée
   ========================================================== */

const DURATION_COLOR_MATCH = [
    "match",["get","TYPE_STATIONNEMENT"],

    "Gratuit 30 min","#c8d6e5", "Payant 30 min","#c8d6e5",
    "Gratuit 60 min","#8ab4d8", "Payant 60 min","#8ab4d8",
    "Gratuit 120 min","#4f8fc7", "Payant 90 min","#4f8fc7", "Payant 120 min","#4f8fc7",
    "Gratuit 180 min","#f4a93c", "Gratuit 240 min","#f4a93c",
    "Gratuit 15 heures","#e8632a",
    "Gratuit illimité","#d81e2c", "Payant illimité","#d81e2c", "Habitant / nuit","#d81e2c",
    "Stationnement interdit","#5a5a5a",

    "#b8b8b8"
];

const DURATION_WIDTH_BASE = [
    "match",["get","TYPE_STATIONNEMENT"],

    "Gratuit 30 min",1.2, "Payant 30 min",1.2,
    "Gratuit 60 min",1.6, "Payant 60 min",1.6,
    "Gratuit 120 min",2.2, "Payant 90 min",2.2, "Payant 120 min",2.2,
    "Gratuit 180 min",2.8, "Gratuit 240 min",2.8,
    "Gratuit 15 heures",3.6,
    "Gratuit illimité",5, "Payant illimité",5, "Habitant / nuit",4.2,
    "Stationnement interdit",4,

    1.2
];

const ZOOM_WIDTH_FACTOR =
    ["interpolate",["linear"],["zoom"], 13,1.6, 20,3];

const DURATION_WIDTH_EXPR =
    ["*",DURATION_WIDTH_BASE,ZOOM_WIDTH_FACTOR];

const DURATION_OPACITY_MATCH = [
    "match",["get","TYPE_STATIONNEMENT"],

    "Gratuit jaune",0.55, "Gratuit jaune spécial",0.55,
    "Electrique",0.55, "Mobility",0.55, "Cars",0.55,
    "Ambulance",0.55, "Police",0.55, "Autre",0.55,
    "Cases 2 roues",0.55, "Stationnement interdit",0.85,

    1
];

const ILLIMITE_TYPES = ["Gratuit illimité","Payant illimité","Habitant / nuit"];

const DURATION_LABEL_MATCH = [
    "match",["get","TYPE_STATIONNEMENT"],

    "Gratuit 30 min","30 min", "Payant 30 min","30 min €",
    "Gratuit 60 min","1 h", "Payant 60 min","1 h €",
    "Gratuit 120 min","2 h", "Payant 90 min","1 h 30 €", "Payant 120 min","2 h €",
    "Gratuit 180 min","3 h", "Gratuit 240 min","4 h",
    "Gratuit 15 heures","15 h",
    "Gratuit illimité","Illimité", "Payant illimité","Illimité €", "Habitant / nuit","Résident",
    "Gratuit jaune","Zone jaune", "Gratuit jaune spécial","Zone jaune +",
    "Electrique","Électrique", "Mobility","Mobility", "Cases 2 roues","Motos",
    "Cars","Cars", "Ambulance","Ambulance", "Police","Police", "Autre","Autre",
    "Stationnement interdit","Interdit",

    ""
];

const DURATION_TEXT_FIELD = [
    "case",
    ["all",["has","NOMBRE_PLACES"],[">",["get","NOMBRE_PLACES"],0]],
    ["concat",DURATION_LABEL_MATCH,"\n",["to-string",["get","NOMBRE_PLACES"]]," pl."],
    DURATION_LABEL_MATCH
];

const DURATION_TEXT_SIZE = [
    "case",
    ["in",["get","TYPE_STATIONNEMENT"],["literal",["Gratuit illimité","Payant illimité","Habitant / nuit","Gratuit 15 heures"]]],
    ["interpolate",["linear"],["zoom"], 14,12, 20,17],
    ["interpolate",["linear"],["zoom"], 14,9, 20,13]
];

function typeColorForPopup(type){

    const pairs = DURATION_COLOR_MATCH.slice(2,-1);

    for(let i=0;i<pairs.length;i+=2)
        if(pairs[i]===type) return pairs[i+1];

    return "#b8b8b8";
}

function addAllSourcesAndLayers(){

    const emptyFC = {type:"FeatureCollection",features:[]};

    /* --- relief DEM (Mappes sardes) : hillshade au-dessus du plan --- */

    map.addSource("terrain",{
        type:"raster-dem",
        url:TERRAIN_DEM_URL,
        tileSize:256,
        encoding:"terrarium"
    });

    map.addLayer({
        id:"hillshade",
        type:"hillshade",
        source:"terrain",
        layout:{ visibility:"none" },
        paint:{
            "hillshade-exaggeration":1,
            "hillshade-illumination-direction":315,
            "hillshade-illumination-anchor":"viewport",
            "hillshade-illumination-altitude":45,
            "hillshade-shadow-color":"#8a8a8a",
            "hillshade-highlight-color":"#ffffff",
            "hillshade-accent-color":"#d8d8d8"
        }
    });

    /* --- stationnement --- */

    map.addSource("stationnement",{type:"geojson",data:emptyFC,buffer:1,tolerance:1});

    map.addLayer({
        id:"stationnement-glow-illimite",
        type:"line",
        source:"stationnement",
        filter:["in",["get","TYPE_STATIONNEMENT"],["literal",ILLIMITE_TYPES]],
        layout:{"line-cap":"round","line-join":"round"},
        paint:{
            "line-color":"#d81e2c",
            "line-width":["interpolate",["linear"],["zoom"], 13,8, 20,22],
            "line-opacity":0.28,
            "line-blur":2.5
        }
    });

    map.addLayer({
        id:"stationnement-line",
        type:"line",
        source:"stationnement",
        filter:["!=",["get","TYPE_STATIONNEMENT"],"Payant illimité"],
        layout:{"line-cap":"round","line-join":"round"},
        paint:{
            "line-color":DURATION_COLOR_MATCH,
            "line-width":DURATION_WIDTH_EXPR,
            "line-opacity":DURATION_OPACITY_MATCH
        }
    });

    map.addLayer({
        id:"stationnement-dash-payant-illimite",
        type:"line",
        source:"stationnement",
        filter:["==",["get","TYPE_STATIONNEMENT"],"Payant illimité"],
        layout:{"line-cap":"butt","line-join":"round"},
        paint:{
            "line-color":"#d81e2c",
            "line-dasharray":[2,1.6],
            "line-width":DURATION_WIDTH_EXPR
        }
    });

    map.addLayer({
        id:"motos-highlight",
        type:"line",
        source:"stationnement",
        filter:["==",["get","TYPE_STATIONNEMENT"],"Cases 2 roues"],
        layout:{"line-cap":"round","line-join":"round"},
        paint:{
            "line-color":"#8b5cf6",
            "line-width":["interpolate",["linear"],["zoom"], 13,3, 20,7],
            "line-opacity":0.95
        }
    });

    map.addLayer({
        id:"stationnement-duration-label",
        type:"symbol",
        source:"stationnement",
        minzoom:14,
        filter:["!=",DURATION_LABEL_MATCH,""],
        layout:{
            "symbol-placement":"line-center",
            "text-field":DURATION_TEXT_FIELD,
            "text-size":DURATION_TEXT_SIZE,
            "text-font":["Noto Sans Bold"],
            "text-rotation-alignment":"viewport",
            "text-pitch-alignment":"viewport",
            "text-keep-upright":true,
            "text-line-height":1.05,
            "text-padding":2
        },
        paint:{
            "text-color":DURATION_COLOR_MATCH,
            "text-halo-color":"#ffffff",
            "text-halo-width":1.8,
            "text-halo-blur":0.2
        }
    });

    /* --- parkings publics --- */

    map.addSource("parking-public",{type:"geojson",data:emptyFC});

    map.addLayer({
        id:"parking-public-circle",
        type:"circle",
        source:"parking-public",
        paint:{
            "circle-radius":["interpolate",["linear"],["zoom"], 11,5, 18,12],
            "circle-color":"#111111",
            "circle-stroke-color":"#ffffff",
            "circle-stroke-width":2
        }
    });

    map.addLayer({
        id:"parking-public-label",
        type:"symbol",
        source:"parking-public",
        minzoom:11,
        layout:{
            "text-field":"P",
            "text-size":["interpolate",["linear"],["zoom"], 11,9, 18,15],
            "text-font":["Noto Sans Bold"]
        },
        paint:{ "text-color":"#ffffff" }
    });
}

/* ==========================================================
   Popups
   ========================================================== */

function bindPopups(){

    ["stationnement-line","stationnement-dash-payant-illimite","motos-highlight"].forEach(layerId=>{

        map.on("mouseenter",layerId,()=>{ map.getCanvas().style.cursor="pointer"; });
        map.on("mouseleave",layerId,()=>{ map.getCanvas().style.cursor=""; });

        map.on("click",layerId,e=>{

            if(!e.features || !e.features.length) return;

            const props = e.features[0].properties;
            const type = props.TYPE_STATIONNEMENT || "—";
            const color = typeColorForPopup(type);

            const rows = [];

            if(props.NOM_RUES)
                rows.push("<tr><td class=\"label\">Rue</td><td>"+props.NOM_RUES+"</td></tr>");

            rows.push(
                "<tr><td class=\"label\">Type</td><td>"+
                "<span class=\"parking-swatch\" style=\"background:"+color+"\"></span>"+type+"</td></tr>"
            );

            if(props.NOMBRE_PLACES!=null)
                rows.push("<tr><td class=\"label\">Places</td><td>"+props.NOMBRE_PLACES+"</td></tr>");

            if(props.NOMBRE_ARCEAUX!=null)
                rows.push("<tr><td class=\"label\">Arceaux</td><td>"+props.NOMBRE_ARCEAUX+"</td></tr>");

            if(props.TYPE_SUPPORT)
                rows.push("<tr><td class=\"label\">Support</td><td>"+props.TYPE_SUPPORT+"</td></tr>");

            openPopup(
                e.lngLat,
                "<div class=\"parking-popup\"><h3>Stationnement</h3><table>"+rows.join("")+"</table></div>"
            );
        });
    });

    map.on("mouseenter","parking-public-circle",()=>{ map.getCanvas().style.cursor="pointer"; });
    map.on("mouseleave","parking-public-circle",()=>{ map.getCanvas().style.cursor=""; });

    map.on("click","parking-public-circle",e=>{

        if(!e.features || !e.features.length) return;

        const p = e.features[0].properties;
        const rows = [];

        if(p.VOCATION) rows.push("<tr><td class=\"label\">Vocation</td><td>"+p.VOCATION+"</td></tr>");
        if(p.NB_PL_PUBLIQUES!=null) rows.push("<tr><td class=\"label\">Places publiques</td><td>"+p.NB_PL_PUBLIQUES+"</td></tr>");
        if(p.NB_PL_HANDICAPE) rows.push("<tr><td class=\"label\">Dont handicapé</td><td>"+p.NB_PL_HANDICAPE+"</td></tr>");
        if(p.NB_PL_MOBILITY) rows.push("<tr><td class=\"label\">Dont Mobility</td><td>"+p.NB_PL_MOBILITY+"</td></tr>");
        if(p.NB_PL_ELECTRIQUE) rows.push("<tr><td class=\"label\">Dont électrique</td><td>"+p.NB_PL_ELECTRIQUE+"</td></tr>");
        if(p.INT_EXT) rows.push("<tr><td class=\"label\">Type</td><td>"+p.INT_EXT+"</td></tr>");

        if(p.LIEN_WWW)
            rows.push(
                "<tr><td class=\"label\">Site</td><td><a href=\""+p.LIEN_WWW+"\" target=\"_blank\" rel=\"noopener\">en savoir plus</a></td></tr>"
            );

        openPopup(
            e.lngLat,
            "<div class=\"parking-popup\"><h3>"+(p.NOM||"Parking")+"</h3><table>"+rows.join("")+"</table></div>"
        );
    });
}

/* ==========================================================
   Panneau "Calques"
   ========================================================== */

function bindLayersSheet(){

    const btn = document.getElementById("layers-toggle");
    const sheet = document.getElementById("layers-sheet");
    const backdrop = document.getElementById("sheet-backdrop");

    function openSheet(){
        sheet.classList.add("open");
        backdrop.classList.add("open");
    }

    function closeSheet(){
        sheet.classList.remove("open");
        backdrop.classList.remove("open");
    }

    btn.addEventListener("click",()=>{

        if(sheet.classList.contains("open")) closeSheet();
        else openSheet();
    });

    backdrop.addEventListener("click",closeSheet);

    document.querySelectorAll('input[name="basemap"]').forEach(radio=>{

        radio.addEventListener("change",e=>{

            if(map.getLayer("hillshade"))
                map.setLayoutProperty(
                    "hillshade","visibility",
                    e.target.value==="relief" ? "visible" : "none"
                );
        });
    });

    document.getElementById("chk-motos").addEventListener("change",e=>{

        if(map.getLayer("motos-highlight"))
            map.setLayoutProperty("motos-highlight","visibility",e.target.checked?"visible":"none");
    });

    document.getElementById("chk-parking").addEventListener("change",e=>{

        ["parking-public-circle","parking-public-label"].forEach(id=>{

            if(map.getLayer(id))
                map.setLayoutProperty(id,"visibility",e.target.checked?"visible":"none");
        });
    });
}

/* ==========================================================
   Initialisation
   ========================================================== */

map.on("load",()=>{

    addAllSourcesAndLayers();
    bindPopups();
    bindLayersSheet();

    loadStationnement();
    loadParkingPublic();
});

map.on("moveend",loadStationnement);

</script>
